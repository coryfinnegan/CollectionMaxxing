# Production stack (OPS-1). Run by the deployer from C:\CollectionMaxxing; see deploy/README.md.
#
# CM_TAG (the git SHA of the image to run) is passed by the deployer in the environment on every call; it is not stored in .env.
# Everything is bound to 127.0.0.1. Tailscale Serve is the only way in from other devices. Postgres is not published at all.
# The ports 8080, 8409, 32400 and 8096 belong to other apps on this PC and must never appear here.
name: collectionmaxxing

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

# Logging: every service sets the same `logging:` block, Docker's json-file driver capped at 5 files of 20 MB (at most
# 100 MB a container), so a chatty container can never fill the disk. A container's json-file log belongs to the
# container: a redeploy recreates the api and backup containers and their logs go with them. The cap is what this is
# for; it is not how logs are kept. (The Aspire dashboard holds the OpenTelemetry copy in memory.)

services:
  postgres:
    <<: *hardening
    # Pinned to an exact patch AND digest: a floating tag would silently upgrade prod Postgres on the next
    # fresh pull. Bump deliberately (read the release notes first), then update the digest to match.
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_DB: collectionmaxxing
      POSTGRES_USER: collectionmaxxing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately no "ports": not published to the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectionmaxxing"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *hardening
    image: ghcr.io/coryfinnegan/collectionmaxxing-migrate:${CM_TAG:?CM_TAG is passed by the deployer}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      ConnectionStrings__collectionmaxxing: Host=postgres;Database=collectionmaxxing;Username=collectionmaxxing;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *hardening
    image: ghcr.io/coryfinnegan/collectionmaxxing-api:${CM_TAG:?CM_TAG is passed by the deployer}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${CM_API_PORT:-5480}:5480"
    environment:
      ASPNETCORE_HTTP_PORTS: "5480"
      # #491: the commit this build came from, reported by GET /health/version so a merge's delivery can be
      # verified against the running server. The deployer sets CM_TAG to the commit it deploys on every call.
      CM_BUILD_SHA: ${CM_TAG}
      ConnectionStrings__collectionmaxxing: Host=postgres;Database=collectionmaxxing;Username=collectionmaxxing;Password=${POSTGRES_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      Catalog__CoversRoot: /data/files/covers
      # Google Books (optional second source for ISBN lookups, next to Open Library). Empty = switched off, silently.
      # The key is a secret: it lives only in .env (never committed) and reaches the API only as this variable.
      Providers__GoogleBooks__ApiKey: ${CM_GOOGLE_BOOKS_API_KEY:-}
      # IGDB (games): Twitch client credentials for title search and box art. Empty = switched off, silently, and
      # game barcodes are then answered from the UPC product alone (title, usually no cover). Free for non-commercial
      # use: register an app at dev.twitch.tv/console, then put the client id and secret in .env. Secrets: never commit.
      Providers__Igdb__ClientId: ${CM_IGDB_CLIENT_ID:-}
      Providers__Igdb__ClientSecret: ${CM_IGDB_CLIENT_SECRET:-}
      # TMDB (films and shows): title search and posters for every DVD, VHS and Blu-ray read. Empty = switched off,
      # silently, and every movie cover then finds nothing. Free for non-commercial use: create an API key at
      # themoviedb.org/settings/api and paste the "API Read Access Token" (or the v3 API key) into .env. Secret: never commit.
      Providers__Tmdb__ApiKey: ${CM_TMDB_API_KEY:-}
      # Open Library (books): a contact email in its User-Agent lifts its limit from 1 request a second to 3. Empty = anonymous.
      # Open Library sees the address on every request; an alias is fine. It lives only in .env (never committed).
      Providers__OpenLibrary__ContactEmail: ${CM_OPENLIBRARY_CONTACT_EMAIL:-}
      # Sign-in through Auth0 (docs/07, docs/14). deploy/auth0/Apply-Auth0.ps1 writes these values to <secrets>\auth0\api.env;
      # copy them into .env. All six are required: without the Management credentials "Sign out all iPhones" would
      # silently do nothing at Auth0.
      Auth__SecretsPath: /secrets
      Auth__PublicOrigin: ${CM_PUBLIC_ORIGIN:?set in .env (see deploy/auth0)}
      Auth__Auth0__Domain: ${CM_AUTH0_DOMAIN:?set in .env (see deploy/auth0)}
      Auth__Auth0__Audience: urn:collectionmaxxing:api
      Auth__Auth0__WebClientId: ${CM_AUTH0_WEB_CLIENT_ID:?set in .env (see deploy/auth0)}
      Auth__Auth0__WebClientSecret: ${CM_AUTH0_WEB_CLIENT_SECRET:?set in .env (see deploy/auth0)}
      Auth__Auth0__ManagementClientId: ${CM_AUTH0_MANAGEMENT_CLIENT_ID:?set in .env (see deploy/auth0)}
      Auth__Auth0__ManagementClientSecret: ${CM_AUTH0_MANAGEMENT_CLIENT_SECRET:?set in .env (see deploy/auth0)}
      # The Data Protection key ring lives on the files volume so sign-ins survive deploys (the volume is covered by
      # BitLocker and the nightly backup). The API refuses to start outside Development without it.
      Auth__KeyRing__Path: /data/files/keyring
      # Export zips (LIB-2b) go on the files volume: the API runs as a non-root user and can't write beside the app.
      # They expire after 24 hours, and the hourly cleanup job deletes them.
      Exports__Path: /data/files/exports
      # Recognition tuning (SCAN-2d): an optional override of the prompt, thresholds and weights the phone fetches. Edit
      # recognition/recognition.json beside this file; the API re-reads it on change, and a bad file is ignored (the last
      # good config keeps serving). The folder is mounted, not the file, so an editor's save-by-replace is seen.
      Recognition__ConfigPath: /config/recognition.json
      # Recognition evals (EVAL-1a), owner only: the golden photos and truth files are read from evals/golden and the run
      # results land in evals/results, both under CM_EVALS_DIR (default C:\CollectionMaxxing\evals, beside the repo clone,
      # never inside it: the photos are private). report.md and the truth drafts (written beside the photos, or in
      # results/drafts if the golden folder can't be written) hold real titles; only the dated aggregate
      # files may be copied into the repo's evals/results/. The routes answer 404 while the golden folder is empty.
      # The golden folder is writable because the phone adds photos to it (POST /api/admin/evals/golden/{set}/{id}).
      Evals__Enabled: ${CM_EVALS_ENABLED:-true}
      Evals__GoldenPath: /evals/golden
      Evals__ResultsPath: /evals/results
      Evals__BaselinePath: /evals/baseline.json
      # Only believe X-Forwarded-For from Tailscale Serve, which reaches the container through the Docker bridge
      # gateway (the API port is published on 127.0.0.1 only, so nothing else can be this peer). Without it every
      # caller shares one rate-limit bucket and a stranger's bad pairing codes could lock the owner out.
      # Confirm at the install checkpoint: if pairing attempts all log the same address, widen or fix this range.
      Auth__RateLimit__TrustedProxies__0: 172.16.0.0/12
      # The shelf reader (ADR-033, #795): the open vision model in the shelf-reader service below. The deployer sets
      # CM_SHELF_READER_ENDPOINT on every call, to http://shelf-reader:8431 once it has switched the reader on and to
      # empty otherwise; it is never set in .env. Empty = off, and the API behaves exactly as without a reader.
      ShelfReader__Endpoint: ${CM_SHELF_READER_ENDPOINT:-}
      ShelfReader__Model: Qwen3VL-8B-Instruct-Q4_K_M.gguf
    volumes:
      - files:/data/files
      - ${CM_SECRETS_DIR:?set in .env}:/secrets
      - ${CM_RECOGNITION_DIR:-./recognition}:/config:ro
      - ${CM_EVALS_DIR:-../../evals}/golden:/evals/golden
      - ${CM_EVALS_DIR:-../../evals}/results:/evals/results
      - ../evals/baseline.json:/evals/baseline.json:ro
    # default: postgres, the dashboard and the internet. reader: the shelf reader, which nothing else may reach.
    networks:
      - default
      - reader
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  aspire-dashboard:
    <<: *hardening
    # Pinned like postgres above (9.0.0 is what :9.0 resolved to when this was frozen). Same rule: bump deliberately.
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0.0@sha256:d595645ca7f5c075174db998302d8fb09e040516b14dfcb06dd02996659e1c77
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "127.0.0.1:${CM_DASHBOARD_PORT:-18888}:18888"
    environment:
      # Reachable on 127.0.0.1 only (the port above) and inside the compose network (OTLP from the api).
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured

  backup:
    <<: *hardening
    image: ghcr.io/coryfinnegan/collectionmaxxing-backup:${CM_TAG:?CM_TAG is passed by the deployer}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      PGHOST: postgres
      PGDATABASE: collectionmaxxing
      PGUSER: collectionmaxxing
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_SCHEDULE: ${CM_BACKUP_SCHEDULE:-0 3 * * *}
      TZ: ${CM_TZ:-UTC}
      CM_HEARTBEAT_URL: ${CM_HEARTBEAT_URL:-}
    volumes:
      - ${CM_BACKUP_DIR:?set in .env}:/backups
      - files:/data/files:ro
    depends_on:
      postgres:
        condition: service_healthy

  # The shelf reader (ADR-033, #795): llama.cpp's server running Qwen3-VL 8B on the PC's graphics card, reached by the
  # api over the compose network only. It sits behind the `gpu` profile, so a plain `up` never starts it: the deployer
  # starts it by itself, after the api is healthy, on a host with an NVIDIA card and the two verified model files
  # (deploy/README.md, "The shelf reader"). CM_SHELF_READER=0 in .env keeps it off. It can never take the app down: the
  # api does not depend on it, its health is not part of a deploy's health check, and a reader that fails is logged and
  # left off without a rollback.
  shelf-reader:
    <<: *hardening
    # Pinned to an exact build AND digest (linux/amd64), like postgres. Bump deliberately.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12282@sha256:bb29527ecb3da442d9459591c252351d957b6e3ee1635e8d0406c0a4442eb08c
    profiles: ["gpu"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    cap_drop:
      - ALL
    # Deliberately no "ports". It sits only on the internal `reader` network, shared with the api alone: llama-server
    # has no API key and allows every origin, so nothing else may reach it (and it has no way out to the internet). It listens on 8431 inside the
    # container, passed explicitly (llama-server's own examples use 8080, which belongs to another app on this PC).
    # --sleep-idle-seconds 300 unloads the model after five idle minutes, so the card's memory is free when nobody scans.
    command:
      - "-m"
      - "/models/Qwen3VL-8B-Instruct-Q4_K_M.gguf"
      - "--mmproj"
      - "/models/mmproj-Qwen3VL-8B-Instruct-F16.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8431"
      - "-ngl"
      - "99"
      - "-c"
      - "12288"
      - "-np"
      - "1"
      - "--no-webui"
      - "--jinja"
      - "--sleep-idle-seconds"
      - "300"
    networks:
      - reader
    volumes:
      # Read-only: the deployer downloads and verifies the files on the host; the container only reads them.
      - ${CM_MODELS_DIR:-../../models}:/models:ro
      # The NVIDIA driver folder of Docker Desktop's WSL 2 VM (the read-only Windows driver store; driver binaries, no
      # user data), read-only, at the same path (#802). Older Docker GPU hooks copy only five of its files into the
      # container and leave out libnvdxgdmal.so.1, which this driver's libcuda needs, so CUDA fails and llama.cpp falls
      # back to the processor. Harmless once Docker copies the whole folder. The path is inside the Linux VM, not on
      # Windows; the config guard allows exactly this mount, on this service only.
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # /health answers without waking a sleeping model. start_period matches the deployer's 10-minute start window
      # (CmShelfReaderStartMinutes): loading 6 GB through a Windows bind mount may take minutes, and failed checks
      # inside it do not count.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8431/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

networks:
  # The api and the shelf reader only (the config guard refuses any other service on it). Internal: no route out.
  reader:
    internal: true

volumes:
  pgdata:
  files:
