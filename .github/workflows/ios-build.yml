name: iOS build (unsigned)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27 # macOS 26 + Xcode 27 (iOS 27 SDK), actions/runner-images#14404
    timeout-minutes: 60
    permissions:
      contents: write # needed only to attach the .ipa to a release on tags
    steps:
      - uses: actions/checkout@v4
      - name: Detect app
        id: detect
        run: |
          if [ -f app/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No app/package.json yet; skipping iOS build."
          fi
      - name: Select newest Xcode
        if: steps.detect.outputs.present == 'true'
        run: |
          newest=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm ci
      - name: Generate the API client from the contract
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm run generate
      - name: Check the tag matches the app version
        # The app compares its own version (app.config.ts) with the released one to offer updates, so a tag that
        # differs from it would nag forever. Bump app.config.ts in a PR first, then tag.
        if: steps.detect.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        run: |
          version=$(npx expo config --type public --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.config.ts version $version. Bump the version, merge, then tag."
            exit 1
          fi
      - name: Prebuild native project
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        if: steps.detect.outputs.present == 'true'
        working-directory: app/ios
        run: pod install
      - name: Build (signing disabled)
        if: steps.detect.outputs.present == 'true'
        working-directory: app/ios
        run: |
          # The JS bundle is built inside xcodebuild; About shows "Build <sha> from <date>" (Expo inlines EXPO_PUBLIC_*).
          export EXPO_PUBLIC_BUILD_SHA="$GITHUB_SHA"
          export EXPO_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned .ipa
        if: steps.detect.outputs.present == 'true'
        working-directory: app/ios
        run: |
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          rm -rf Payload && mkdir Payload
          cp -R "$app" Payload/
          zip -qry CollectionMaxxing-unsigned.ipa Payload
          ls -lh CollectionMaxxing-unsigned.ipa
          shasum -a 256 CollectionMaxxing-unsigned.ipa | awk '{print $1}' > CollectionMaxxing-unsigned.ipa.sha256
      - name: Upload artifact
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CollectionMaxxing-unsigned-ipa
          path: |
            app/ios/CollectionMaxxing-unsigned.ipa
            app/ios/CollectionMaxxing-unsigned.ipa.sha256
          if-no-files-found: error
      - name: Attach to release
        if: steps.detect.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The install link goes first, so a release notification on the phone leads straight to the .ipa.
          ipa="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/CollectionMaxxing-unsigned.ipa"
          notes="**Install on iPhone:** download [CollectionMaxxing-unsigned.ipa]($ipa) at home on the same Wi-Fi as the PC, then AltStore > My Apps > + and pick the file."
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" app/ios/CollectionMaxxing-unsigned.ipa app/ios/CollectionMaxxing-unsigned.ipa.sha256 --clobber
