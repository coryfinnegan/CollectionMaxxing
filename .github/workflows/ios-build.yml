name: iOS build (unsigned)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27 # macOS 26 + Xcode 27 (iOS 27 SDK), actions/runner-images#14404
    timeout-minutes: 60
    permissions:
      contents: write # needed only to attach the .ipa to a release on tags
    steps:
      - uses: actions/checkout@v4
      - name: Detect app
        id: detect
        run: |
          if [ -f app/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No app/package.json yet; skipping iOS build."
          fi
      - name: Select newest Xcode
        if: steps.detect.outputs.present == 'true'
        run: |
          newest=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm ci
      - name: Generate the API client from the contract
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm run generate
      - name: Prebuild native project
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        if: steps.detect.outputs.present == 'true'
        working-directory: app/ios
        run: pod install
      - name: Build (signing disabled)
        if: steps.detect.outputs.present == 'true'
        working-directory: app/ios
        run: |
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned .ipa
        if: steps.detect.outputs.present == 'true'
        working-directory: app/ios
        run: |
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          rm -rf Payload && mkdir Payload
          cp -R "$app" Payload/
          zip -qry CollectionMaxxing-unsigned.ipa Payload
          ls -lh CollectionMaxxing-unsigned.ipa
      - name: Upload artifact
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CollectionMaxxing-unsigned-ipa
          path: app/ios/CollectionMaxxing-unsigned.ipa
          if-no-files-found: error
      - name: Attach to release
        if: steps.detect.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" app/ios/CollectionMaxxing-unsigned.ipa --clobber
