# Signs the iPhone app and uploads it to TestFlight (ADR-024). The one-time setup and the yearly certificate renewal
# are in deploy/runbooks/iphone-app-testflight.md.
#
#   v* tag              build that tag, upload it, and create the GitHub release
#   schedule            rebuild the latest release with a new build number: a TestFlight build stops opening 90 days
#                       after upload, and this runs on the 1st of every other month, so a quiet spell never lets it lapse
#   workflow_dispatch   build the chosen branch (main) and upload it, for example to check the setup before tagging
#
# The signing secrets live in the `testflight` environment, which only main and v* tags can use, so pull requests and
# forks never see them. Builds go to internal testers only (testFlightInternalTestingOnly): never to the App Store.
name: iOS build (TestFlight)

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 9 1 */2 *'

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27 # macOS 26 + Xcode 27 (iOS 27 SDK), actions/runner-images#14404
    timeout-minutes: 60
    environment: testflight
    permissions:
      contents: write # create the GitHub release on tags
    env:
      BUNDLE_ID: io.github.coryfinnegan.collectionmaxxing
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      PROFILE_NAME: ${{ vars.APPLE_PROFILE_NAME }}
      SIGNING_EXPIRES: ${{ vars.APPLE_SIGNING_EXPIRES }}
    steps:
      - name: Choose what to build
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            ref=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            if [ -z "$ref" ]; then echo "::error::There is no release to rebuild yet."; exit 1; fi
            echo "Rebuilding the latest release, $ref, so testers always have a build that opens."
            echo "ref=refs/tags/$ref" >> "$GITHUB_OUTPUT"
            echo "tag=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Check the signing setup
        env:
          HAS_P12: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
          HAS_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE != '' }}
          HAS_API_KEY: ${{ secrets.ASC_API_KEY_P8 != '' }}
          HAS_AUTH0_DOMAIN: ${{ secrets.EXPO_PUBLIC_AUTH0_DOMAIN != '' }}
          HAS_AUTH0_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_AUTH0_CLIENT_ID != '' }}
          HAS_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL != '' }}
        run: |
          missing=""
          [ "$HAS_P12" = "true" ] || missing="$missing APPLE_CERTIFICATE_P12"
          [ "$HAS_PROFILE" = "true" ] || missing="$missing APPLE_PROVISIONING_PROFILE"
          [ "$HAS_API_KEY" = "true" ] || missing="$missing ASC_API_KEY_P8"
          # Sign-in (docs/14): the Auth0 tenant, the iPhone app's client id and the server's address are built into the app.
          [ "$HAS_AUTH0_DOMAIN" = "true" ] || missing="$missing EXPO_PUBLIC_AUTH0_DOMAIN"
          [ "$HAS_AUTH0_CLIENT_ID" = "true" ] || missing="$missing EXPO_PUBLIC_AUTH0_CLIENT_ID"
          [ "$HAS_API_URL" = "true" ] || missing="$missing EXPO_PUBLIC_API_URL"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$PROFILE_NAME" ] || missing="$missing APPLE_PROFILE_NAME"
          if [ -n "$missing" ]; then
            echo "::error::The testflight environment is missing:$missing. Run deploy/apple/Publish-SigningSecrets.ps1 (deploy/runbooks/iphone-app-testflight.md)."
            exit 1
          fi
          if [ -n "$SIGNING_EXPIRES" ]; then
            left=$(( ( $(date -j -u -f '%Y-%m-%d' "$SIGNING_EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
            if [ "$left" -lt 0 ]; then
              echo "::error::The distribution certificate or profile expired on $SIGNING_EXPIRES. Renew it: deploy/runbooks/iphone-app-testflight.md, yearly renewal."
              exit 1
            elif [ "$left" -lt 30 ]; then
              echo "::warning::The distribution certificate or profile expires on $SIGNING_EXPIRES ($left days). Renew it soon: deploy/runbooks/iphone-app-testflight.md, yearly renewal."
            fi
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.what.outputs.ref }}

      - name: Select the newest released Xcode
        # App Store Connect refuses uploads built with a beta Xcode (ITMS-90534). The runner image also links names
        # like Xcode_27.2.app to Xcode_27.2_beta_2.app, so each name is judged by the real folder behind it. A final
        # release wins; a release candidate only when there is none. The app needs the iOS 27 SDK, so Xcode 27 at least.
        run: |
          echo "Installed:"
          for app in /Applications/Xcode*.app; do echo "  $app -> $(cd -P "$app" && pwd -P)"; done
          real=$(for app in /Applications/Xcode*.app; do (cd -P "$app" && pwd -P); done | sort -u)
          newest=$(printf '%s\n' "$real" | grep -v -i -E 'beta|release_candidate' | sort -V | tail -1)
          [ -n "$newest" ] || newest=$(printf '%s\n' "$real" | grep -v -i 'beta' | sort -V | tail -1)
          if [ -z "$newest" ]; then
            echo "::error::No released Xcode on this runner, and App Store Connect rejects builds from a beta."; exit 1
          fi
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')
          if [ "${major:-0}" -lt 27 ]; then
            echo "::error::The newest released Xcode here is $major; the app needs Xcode 27 (iOS 27 SDK). Check the runner image."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate the API client from the contract
        working-directory: app
        run: npm run generate

      - name: Read the app version (and check it matches the tag)
        # A version that differs from its tag would confuse TestFlight and the release notes. Bump app.config.ts in a
        # PR first, then tag.
        working-directory: app
        env:
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          version=$(npx expo config --type public --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match app.config.ts version $version. Bump the version, merge, then tag."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install the certificate and the profile
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          password=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$password" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/distribution.p12"
          # An identity is the certificate paired with its private key: without the key nothing can sign. Counted, not
          # listed, so the certificate's name stays out of the public log.
          identities=$(security find-identity -p codesigning "$keychain" | grep -c 'Apple Distribution' || true)
          echo "Apple Distribution identities in the keychain: $identities"
          if [ "$identities" -lt 1 ]; then
            echo "::error::APPLE_CERTIFICATE_P12 holds no Apple Distribution certificate together with its private key. Run deploy/apple/Publish-SigningSecrets.ps1 again (deploy/runbooks/iphone-app-testflight.md)."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profile="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          uuid=$(security cms -D -i "$profile" | plutil -extract UUID raw -o - -)
          # Xcode 16 and later read profiles from UserData; older tools from MobileDevice.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "Installed profile '$PROFILE_NAME' ($uuid) for team $TEAM_ID"

      - name: Prebuild the native project with release signing
        working-directory: app
        env:
          IOS_SIGNING_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_SIGNING_PROFILE: ${{ vars.APPLE_PROFILE_NAME }}
          EXPO_PUBLIC_AUTH0_DOMAIN: ${{ secrets.EXPO_PUBLIC_AUTH0_DOMAIN }}
        run: |
          # Every upload of a version needs a higher build number; the run number only ever grows for this workflow.
          export IOS_BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$GITHUB_ENV"
          npx expo prebuild --platform ios --no-install
          pbx=$(find ios -maxdepth 2 -name project.pbxproj | head -1)
          grep -q "PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"" "$pbx" || {
            echo "::error::The release signing plugin did not set the profile in $pbx."; exit 1; }

      - name: Install pods
        working-directory: app/ios
        run: pod install

      - name: Archive
        working-directory: app/ios
        env:
          # Inlined into the JS bundle: the Auth0 tenant and iPhone client id for sign-in, and the server the app talks to.
          EXPO_PUBLIC_AUTH0_DOMAIN: ${{ secrets.EXPO_PUBLIC_AUTH0_DOMAIN }}
          EXPO_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_AUTH0_CLIENT_ID }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          # The JS bundle is built inside xcodebuild; About shows "Build <sha> from <date>" (Expo inlines EXPO_PUBLIC_*).
          export EXPO_PUBLIC_BUILD_SHA="$(git rev-parse HEAD)"
          export EXPO_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build -archivePath "$RUNNER_TEMP/CollectionMaxxing.xcarchive" \
            archive

      - name: Export the signed .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CollectionMaxxing.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          key_id=$(printf '%s' "$ASC_KEY_ID" | tr -d '\r\n')
          issuer=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '\r\n')
          # altool looks for the key here by its ID.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${key_id}.p8"
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$key_id" --apiIssuer "$issuer"
          {
            echo "### Uploaded to TestFlight"
            echo "Version $VERSION, build $BUILD_NUMBER. It reaches testers once Apple finishes processing it, usually within half an hour."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="**On iPhone:** this version comes through TestFlight as build $BUILD_NUMBER. With automatic updates on, it installs on its own once Apple has processed it; otherwise open TestFlight and tap Update."
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes"

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/distribution.p12"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
