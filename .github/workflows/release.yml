# PROPOSED by OPS-1. The lead copies this file to .github/workflows/release.yml (a hot file; builders do not touch it).
#
# On every push to main it builds the api, migrate and backup images, pushes them to GHCR tagged with the commit SHA
# only, and signs a build attestation for each. A second job (promote) then moves the moving "main" tag onto all three,
# but only after every leg AND its attestation succeeded, so :main always names a complete, attested set. The deployer
# on the owner's PC reads api:main for the newest commit and verifies each attestation with
# `gh attestation verify --signer-workflow <owner>/<repo>/.github/workflows/release.yml`, requiring the certificate to
# say refs/heads/main, so the file name "release.yml" matters: do not rename it without changing the deployer.
#
# After copying: make the three GHCR packages public (Package settings > Change visibility), once, so the PC can pull
# without logging in. They contain no secrets or data.
name: Release images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false # let a started build finish; the deployer only ever wants the newest main

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing of the attestation
      attestations: write
    strategy:
      # Legs push SHA tags only, which nothing reads until :main moves, so a failure cancels the rest quickly.
      fail-fast: true
      matrix:
        include:
          - image: api
            file: deploy/docker/Dockerfile.api
            context: .
          - image: migrate
            file: deploy/docker/Dockerfile.migrate
            context: .
          - image: backup
            file: deploy/backup/Dockerfile.backup
            context: deploy/backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name (GHCR needs lower case)
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/collectionmaxxing-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # The web app is exported once and baked into the api image. Skipped until app/ exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.image == 'api' && hashFiles('app/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Export the web app
        id: web
        if: matrix.image == 'api' && hashFiles('app/package.json') != ''
        working-directory: app
        run: |
          npm ci
          npm run generate # the API client is gitignored
          # About shows "Build <sha> from <date>", so the owner can see a deploy landed (Expo inlines EXPO_PUBLIC_*).
          export EXPO_PUBLIC_BUILD_SHA="$GITHUB_SHA"
          export EXPO_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx expo export --platform web --output-dir dist
          echo "dist=app/dist" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false # the signed attestation below replaces the default one
          build-args: ${{ matrix.image == 'api' && format('WEB_DIST={0}', steps.web.outputs.dist || 'deploy/docker/no-web') || '' }}
          # The SHA tag only: :main moves in the promote job below, after every leg AND its attestation succeeded.
          tags: ${{ steps.name.outputs.repo }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Attest the build (this is what the deployer checks)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote:
    # Moves :main onto this commit's images. needs: images means this runs only when every leg built, pushed AND
    # attested, so :main always names a complete set and the deployer never chases a partial release.
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # move the :main tags on GHCR
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move :main onto this commit's images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          for image in api migrate backup; do
            docker buildx imagetools create \
              --tag "ghcr.io/$owner/collectionmaxxing-$image:main" \
              "ghcr.io/$owner/collectionmaxxing-$image:${{ github.sha }}"
          done
