name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend leg, split so the slowest suites stop queueing behind each other (#478). The test matrix, format,
  # and the pwsh tooling suites each get their own runner and run at the same time. Every dotnet job warms the same
  # NuGet cache. No app phase anywhere here; the app job owns npm run check.
  backend-test:
    # Without this, GitHub names a shard after every matrix value, filter included. None of these names is a required
    # check (the ruleset requires `backend`, `app` and `e2e`), so the shard names are free to change.
    name: backend-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One red shard cancels its siblings: a broken PR fails in minutes, not after the slowest shard finishes.
      fail-fast: true
      matrix:
        include:
          # Shards follow the measured lane times (run 41143875942: api 671s, auth 390s, rest 273s). The two
          # Postgres-heavy Api suites run every test one after another against one container and one API host
          # (AssemblyInfo.cs in each), so they are sharded by test filter instead: every shard gets its own runner,
          # container and host. Rebalance when the timings drift.
          #
          # A shard's `filter` is a VSTest expression (see CM_TEST_FILTER in scripts/check.sh). The shards of a suite
          # are written as complements of each other, so a new namespace or class can never fall between them: the
          # last shard is "everything not in the others" (De Morgan'd by hand, as VSTest cannot negate a group).
          # Two checks keep that honest. scripts/check.sh fails a shard whose filter matches no tests, and every
          # shard uploads how many tests it lists next to how many the whole suite lists; the `backend` job fails
          # unless each suite's shards add up to exactly the suite (no test skipped, none run twice). Edit a filter
          # and its complement together; the check names the suite that stopped adding up.
          #
          # api (Api.Tests): api-1 = Scanning.Identify + Scanning.Artwork; api-2 = the classes directly in Scanning
          # (not its sub-namespaces); api-3 = everything else.
          - shard: api-1
            projects: CollectionMaxxing.Api.Tests
            filter: >-
              FullyQualifiedName~CollectionMaxxing.Api.Tests.Scanning.Identify.
              | FullyQualifiedName~CollectionMaxxing.Api.Tests.Scanning.Artwork.
          - shard: api-2
            projects: CollectionMaxxing.Api.Tests
            filter: >-
              FullyQualifiedName~CollectionMaxxing.Api.Tests.Scanning.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Identify.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Artwork.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Photo.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Provisional.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Events.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Quota.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Learning.
          - shard: api-3
            projects: CollectionMaxxing.Api.Tests
            filter: >-
              FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Identify.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.Artwork.
              & ( FullyQualifiedName!~CollectionMaxxing.Api.Tests.Scanning.
              | FullyQualifiedName~CollectionMaxxing.Api.Tests.Scanning.Photo.
              | FullyQualifiedName~CollectionMaxxing.Api.Tests.Scanning.Provisional.
              | FullyQualifiedName~CollectionMaxxing.Api.Tests.Scanning.Events.
              | FullyQualifiedName~CollectionMaxxing.Api.Tests.Scanning.Quota.
              | FullyQualifiedName~CollectionMaxxing.Api.Tests.Scanning.Learning. )
          # auth (Api.Tests.Auth): auth-1 = the Authorization and Auth namespaces; auth-2 = everything else
          # (Security, Onboarding, Invites, Members, KeyRing and whatever comes next). Split by time, not by count:
          # 609 of the 968 tests are one cheap theory, the authorization matrix (about 0.14 s a row against about
          # 0.9 s for the sign-in, onboarding and security tests), so the shards list 727 and 241 tests and take
          # about the same time (per-class times from run 41153067225: roughly 200 s each).
          - shard: auth-1
            projects: CollectionMaxxing.Api.Tests.Auth
            filter: >-
              FullyQualifiedName~CollectionMaxxing.Api.Tests.Authorization.
              | FullyQualifiedName~CollectionMaxxing.Api.Tests.Auth.
          - shard: auth-2
            projects: CollectionMaxxing.Api.Tests.Auth
            filter: >-
              FullyQualifiedName!~CollectionMaxxing.Api.Tests.Authorization.
              & FullyQualifiedName!~CollectionMaxxing.Api.Tests.Auth.
          - shard: rest
            projects: >-
              CollectionMaxxing.Api.Tests.Library
              CollectionMaxxing.Infrastructure.Tests
              CollectionMaxxing.Application.Tests
              CollectionMaxxing.Recognition.Evals
              CollectionMaxxing.Architecture.Tests
              CollectionMaxxing.Domain.Tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # One phase per step (#297): timings and failures localize.
      - name: Restore
        run: bash scripts/check.sh restore
      - name: Build
        run: bash scripts/check.sh build
      - name: Test (${{ matrix.shard }})
        env:
          CM_TEST_ONLY: ${{ matrix.projects }}
          CM_TEST_FILTER: ${{ matrix.filter }}
          CM_SHARD_REPORT: ${{ runner.temp }}/shard-report/${{ matrix.shard }}.txt
        run: bash scripts/check.sh test
      # Only sharded suites report (the `rest` shard has no filter): see the shard check in the `backend` job.
      - name: Upload shard report
        if: matrix.filter != ''
        uses: actions/upload-artifact@v4
        with:
          name: shard-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-report/${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 1

  backend-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: bash scripts/check.sh restore
      - name: Format
        run: bash scripts/check.sh format

  backend-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Deploy script tests
        run: pwsh -NoProfile -File deploy/tests/Run-Tests.ps1
      # A new tests/ project that no backend-test shard names would pass locally (check.sh runs every project) and never
      # run here, with the `backend` check still green. This fails the build instead (scripts/check-ci-coverage.sh).
      - name: Every test project is in a CI shard
        run: bash scripts/check-ci-coverage.sh
      # The mutation sampler's own tests (QA-3a): scripts/check doesn't run them, and the nightly sweep relies on them.
      - name: Mutation tooling tests
        run: pwsh -NoProfile -File scripts/mutation/tests.ps1
      # The k6 tooling (QA-2a) and security scan scripts (QA-1c) test themselves with fakes; no load or scan runs here.
      - name: Perf tooling tests
        run: pwsh -NoProfile -File scripts/perf/tests.ps1 -SkipDocker
      - name: Security scan tooling tests
        run: pwsh -NoProfile -File scripts/security/Run-Tests.ps1

  # Aggregator restoring the `backend` required-check context (ruleset "Require CI on main" requires backend/app/e2e).
  # Passes only when every backend leg succeeded. `if: always()` keeps this job (and its context) present even when a
  # leg fails, is skipped, or is cancelled, and the step fails closed on any non-success result so skips/cancels can
  # never silently pass. `needs.backend-test.result` aggregates across matrix shards: success only if every shard
  # succeeded, failure if any shard failed (fail-fast cancels the siblings, which still yields failure, never success).
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-test, backend-format, backend-tooling]
    if: always()
    steps:
      - name: Verify all backend legs succeeded
        run: |
          test "${{ needs.backend-test.result }}" = success || { echo "backend-test: ${{ needs.backend-test.result }}"; exit 1; }
          test "${{ needs.backend-format.result }}" = success || { echo "backend-format: ${{ needs.backend-format.result }}"; exit 1; }
          test "${{ needs.backend-tooling.result }}" = success || { echo "backend-tooling: ${{ needs.backend-tooling.result }}"; exit 1; }
      # The sharding guarantee. Each shard of a sliced suite uploaded "project, tests it lists, tests the whole suite
      # lists, tests it ran" (scripts/check.sh, CM_SHARD_REPORT). Because the listings are counted the same way,
      # shards that add up to the suite's total are, with their filters being complements, a partition: no test is
      # skipped and none runs twice. A suite with fewer than two reports fails too, so a dropped shard cannot pass.
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: shard-report-*
          path: shard-reports
          merge-multiple: true
      - name: Verify the shards add up to each whole suite
        run: |
          awk -v want="CollectionMaxxing.Api.Tests CollectionMaxxing.Api.Tests.Auth" -v summary="$GITHUB_STEP_SUMMARY" '
            BEGIN { bad = 0 }
            {
              k = split(FILENAME, parts, "/"); shard = parts[k]; sub(/\.txt$/, "", shard)
              project = $1; listed = $2; total = $3; ran = $4
              rows[++r] = sprintf("| %s | %s | %d | %d | %d |", shard, project, listed, ran, total)
              n[project]++; sum[project] += listed; ranSum[project] += ran
              if (listed == 0) { print "::error::" shard " listed no tests"; bad = 1 }
              if ((project in suite) && suite[project] != total) { print "::error::" project ": shards disagree on the suite size"; bad = 1 }
              suite[project] = total
            }
            END {
              nw = split(want, w, " ")
              for (i = 1; i <= nw; i++) {
                p = w[i]
                if (n[p] < 2) { print "::error::" p ": expected at least 2 shard reports, found " n[p] + 0; bad = 1; continue }
                if (sum[p] != suite[p]) { print "::error::" p ": its shards list " sum[p] " tests but the suite lists " suite[p]; bad = 1; continue }
                print p ": " n[p] " shards list " sum[p] " of " suite[p] " tests (ran " ranSum[p] ")"
              }
              print "| shard | suite | listed in shard | ran | listed in suite |" >> summary
              print "| --- | --- | --: | --: | --: |" >> summary
              for (j = 1; j <= r; j++) print rows[j] >> summary
              exit bad
            }' shard-reports/*.txt

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      # A warm Jest transform cache: cold runs on the 2-core runner made the first library tests time out (#87).
      - uses: actions/cache@v6
        with:
          path: app/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/jest.config.js') }}-${{ github.sha }}
          restore-keys: jest-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/jest.config.js') }}-
      - name: Check
        working-directory: app
        env:
          JEST_CACHE_DIR: ${{ github.workspace }}/app/.jest-cache
          CM_APP_CHECK_LOG_DIR: ${{ runner.temp }}/cm-app-check
        run: npm run check
      # Keep the failure evidence (#260): the step log plus the jest report that names the failed tests.
      - name: Upload app gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-check-logs
          path: ${{ runner.temp }}/cm-app-check/

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Install browsers
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Generate API client
        working-directory: app
        run: npm run generate
      - name: Playwright
        working-directory: app
        run: npm run test:e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: app/test-results/
      - name: Build Storybook
        working-directory: app
        run: npm run build-storybook
