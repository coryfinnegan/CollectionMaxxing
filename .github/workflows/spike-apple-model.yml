name: spike-apple-model
on:
  push:
    branches: [w0/spike-apple-model]
    paths: ['spikes/apple-model/**', '.github/workflows/spike-apple-model.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*
          X=/Applications/Xcode_27.0.app; ls -d "$X" || X=$(ls -d /Applications/Xcode_27.0*.app | head -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios; xcrun --sdk iphoneos --show-sdk-version
      - name: Extract FoundationModels interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "$SDK"
          mkdir -p out; ls -la "$SDK/System/Library/Frameworks/FoundationModels.framework" "$SDK/System/Library/Frameworks/FoundationModels.framework/Modules" | tee out/ls.txt
          find -L "$SDK/System/Library/Frameworks/FoundationModels.framework" -path '*FoundationModels*' > out/files.txt
          find -L "$SDK/System/Library/Frameworks/FoundationModels.framework" -path '*FoundationModels*' -name '*.swiftinterface' ! -name '*.private.*' ! -name '*.package.*' -exec cp {} out/ \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: foundationmodels-interface
          path: out
      - name: Generate project
        working-directory: spikes/apple-model
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (iphoneos, Release, unsigned)
        working-directory: spikes/apple-model
        run: |
          set -o pipefail
          xcodebuild -project CMSpike.xcodeproj -scheme CMSpike -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -40
      - name: Package ipa
        working-directory: spikes/apple-model
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/CMSpike.app ipa/Payload/
          (cd ipa && zip -qry ../CMSpike.ipa Payload)
          ls -la CMSpike.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CMSpike-ipa
          path: spikes/apple-model/CMSpike.ipa
