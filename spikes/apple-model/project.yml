name: CMSpike
options:
  bundleIdPrefix: io.github.coryfinnegan
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  CMSpike:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coryfinnegan.cmspike
        PRODUCT_NAME: CMSpike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of a collectible to test recognition."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick a photo of a collectible to test recognition."
        TARGETED_DEVICE_FAMILY: "1"
